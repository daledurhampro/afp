[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "afp-database",
    "boto3>=1.40.29",
    "langfuse>=4.7.0,<5",
    "logfire>=4.7.0,<4.33",
    "openai-agents>=0.3.0",
    "pydantic-ai>=1.0.6",
    "python-dotenv>=1.1.1",
]

[tool.uv.workspace]
members = [
    "database",
    "api",
    "scheduler",
]

[tool.uv.sources]
afp-database = { workspace = true }
